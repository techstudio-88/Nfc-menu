<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline · TapMenu</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf6f1;color:#1f1416;font-family:system-ui,sans-serif;text-align:center;padding:24px}
.r{width:84px;height:84px;margin:0 auto 24px;border-radius:50%;border:2px solid #8e1b2a;animation:p 2s ease-out infinite}@keyframes p{from{transform:scale(.5);opacity:1}to{transform:scale(1.4);opacity:0}}
h1{font-family:Georgia,serif;font-size:34px;margin:0 0 8px}p{color:#7a6a6c;margin:0 0 24px}button{background:#8e1b2a;color:#fff;border:0;border-radius:999px;padding:14px 28px;font-weight:600}</style></head>
<body><main><div class="r"></div><h1>You’re offline</h1><p>Check your connection — we’ll pick up right where you left off.</p><button onclick="location.reload()">Try again</button></main></body></html>
